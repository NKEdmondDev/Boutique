<div class="card">

    <img
        [src]="product.image"
        [alt]="product.name"
    >

    <div class="card-body">

        <h3>{{ product.name }}</h3>

        <h2>{{ product.price }} $</h2>

        <button>

            <i class="fa-solid fa-cart-shopping"></i>

            Ajouter au panier

        </button>

    </div>

</div>
